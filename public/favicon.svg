<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="OwO! FlightAssistant">
  <title>OwO! FlightAssistant</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17406e"/>
      <stop offset="1" stop-color="#0a1b33"/>
    </linearGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffdc6b"/>
      <stop offset="0.6" stop-color="#f7ae1c"/>
      <stop offset="1" stop-color="#e58a00"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#tile)"/>
  <circle cx="64" cy="66" r="50" fill="#ffc83d" fill-opacity=".12"/>
  <!-- 云 -->
  <g fill="#fff" fill-opacity=".12">
    <ellipse cx="20" cy="30" rx="11" ry="4.500"/>
    <ellipse cx="110" cy="100" rx="12" ry="4.500"/>
  </g>

  <!-- 耳羽 -->
  <g fill="#f7ae1c" stroke="#f7ae1c" stroke-width="7" stroke-linejoin="round">
    <path d="M35 30 53 42 36 55Z"/>
    <path d="M93 30 75 42 92 55Z"/>
  </g>

  <!-- 展开的机翼 -->
  <path d="M33 70 7 84l2 8 28-4Z" fill="#d97706" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>
  <path d="M95 70 121 84l-2 8-28-4Z" fill="#d97706" stroke="#d97706" stroke-width="3" stroke-linejoin="round"/>

  <!-- 身体与头 -->
  <ellipse cx="64" cy="68" rx="36" ry="40" fill="url(#body)"/>

  <!-- 肚子：飞机 -->
  <rect x="44" y="79" width="40" height="27" rx="13.500" fill="#fff3cf"/>
  <path fill="#b45309" d="M64 81.500c1.300 0 2.200 1.100 2.200 2.800V90l9.300 5.600v3.200L66.200 95.500v5.300l3.200 2.300v2.200L64 103.200 58.600 105.300v-2.200l3.200-2.300v-5.300l-9.300 3.300v-3.200L61.800 90V84.300c0-1.700.9-2.800 2.200-2.800Z"/>

  <!-- 护目镜束带 -->
  <path d="M29 56H99" stroke="#1a2b4a" stroke-width="7" stroke-linecap="round"/>

  <!-- 护目镜 -->
  <circle cx="47.500" cy="56" r="15" fill="#e8f6ff" stroke="#1a2b4a" stroke-width="5"/>
  <circle cx="80.500" cy="56" r="15" fill="#e8f6ff" stroke="#1a2b4a" stroke-width="5"/>
  <path d="M62 56h4" stroke="#1a2b4a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="49.500" cy="57.500" r="6.800" fill="#0a1b33"/>
  <circle cx="78.500" cy="57.500" r="6.800" fill="#0a1b33"/>
  <circle cx="51.800" cy="55" r="2.400" fill="#fff"/>
  <circle cx="80.800" cy="55" r="2.400" fill="#fff"/>

  <!-- 喙 -->
  <path d="M59.500 66h9L64 74Z" fill="#c2410c" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round"/>

  <!-- 脚 -->
  <ellipse cx="53" cy="110" rx="7" ry="3.500" fill="#fff3cf"/>
  <ellipse cx="75" cy="110" rx="7" ry="3.500" fill="#fff3cf"/>
</svg>
